name: "Forkfix Parallel Reality Debugger"
description: "Resolves open-source repository bugs with verified test proofs and sub-dime execution costs using Nebius Token Factory and NVIDIA Nemotron."
author: "Farhan"
branding:
  icon: "git-pull-request"
  color: "green"

inputs:
  nebius_api_key:
    description: "Nebius Token Factory API Key"
    required: true
  tavily_api_key:
    description: "Tavily Autonomous Web Research API Key"
    required: false
    default: ""
  issue_text:
    description: "Bug report description or issue text"
    required: true
  test_command:
    description: "Reproduction test command"
    required: false
    default: "pytest -q"
  max_branches:
    description: "Number of parallel reality branches"
    required: false
    default: "4"
  sandbox_engine:
    description: "Sandbox implementation (mock, docker, or contree)"
    required: false
    default: "mock"

outputs:
  status:
    description: "Resolution status (resolved | failed)"
    value: ${{ steps.forkfix_run.outputs.status }}
  winning_patch:
    description: "Unified diff of the winning patch"
    value: ${{ steps.forkfix_run.outputs.winning_patch }}
  total_cost:
    description: "Total token execution spend in USD"
    value: ${{ steps.forkfix_run.outputs.total_cost }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Forkfix Backend
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r forkfix/backend/requirements.txt

    - name: Execute Parallel Reality Resolution
      id: forkfix_run
      shell: bash
      env:
        PYTHONPATH: "${{ github.action_path }}:."
        NEBIUS_API_KEY: ${{ inputs.nebius_api_key }}
        TAVILY_API_KEY: ${{ inputs.tavily_api_key }}
        SANDBOX_ENGINE: ${{ inputs.sandbox_engine }}
        FORKFIX_ISSUE_TEXT: ${{ inputs.issue_text }}
      run: |
        echo "Starting Forkfix parallel reality resolution with ${{ inputs.max_branches }} branches..."
        python -m forkfix.action_runner \
          --issue-text "$FORKFIX_ISSUE_TEXT" \
          --engine "$SANDBOX_ENGINE" \
          --max-branches "${{ inputs.max_branches }}"
