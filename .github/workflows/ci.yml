name: Forkfix CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio fastapi uvicorn pydantic httpx python-dotenv openai tavily-python aiofiles

      - name: Run Pytest Suite
        run: |
          pytest forkfix/backend/tests/ -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: forkfix/frontend/package-lock.json

      - name: Install dependencies
        working-directory: forkfix/frontend
        run: npm ci

      - name: Run Build
        working-directory: forkfix/frontend
        run: npm run build
